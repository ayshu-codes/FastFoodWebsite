<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link rel="stylesheet" href="order.css">
</head>
<body>
    <div class="main">
    <center>
        <div class="form">
        <h2 style="font-style: normal; font-size: 60px;">Order Now!!</h2>
        <br><br>
        <form>
            <table>
                <tr>
                    <td>Name: </td><td><input type="text"></td>
                </tr>
                <tr>
                    <td>Place:</td><td><input type="text"></td>
                </tr>
                <tr>
                    <td>Address:</td><td><input type="text"></td>
                </tr>
                <tr>
                    <td>Pincode:</td><td><input type="number"></td>
                </tr>
                <tr>
                    <td>Phone Number:</td><td><input type="number"></td>
                </tr>
                <tr>
                    <td>Select the Quantity</td>
                    <td><select>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                    </select></td>
                </tr>
                <tr>
                    <td></td><td><input type="submit" value="Confirm" style="cursor: pointer;"></td>
                </tr>
            </table>
        </form>
        </div>
        <br><br>
        <br>
        </div>
    </center>
